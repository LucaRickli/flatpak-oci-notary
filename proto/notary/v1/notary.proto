syntax = "proto3";

package notary.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lucarickli/flatpak-oci-notary/internal/gen/notary/v1;notaryv1";

// All ids are UUIDs (version 7) in their canonical string form.

// SystemService exposes server info and the current session. GetInfo and
// GetMe are available without authentication.
service SystemService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// RegistryService manages upstream OCI registries that get indexed.
service RegistryService {
  rpc ListRegistries(ListRegistriesRequest) returns (ListRegistriesResponse);
  rpc GetRegistry(GetRegistryRequest) returns (GetRegistryResponse);
  rpc CreateRegistry(CreateRegistryRequest) returns (CreateRegistryResponse);
  rpc UpdateRegistry(UpdateRegistryRequest) returns (UpdateRegistryResponse);
  rpc DeleteRegistry(DeleteRegistryRequest) returns (DeleteRegistryResponse);
  // Starts a sync in the background (embedded syncer) or records a sync
  // request for the external syncer; poll GetRegistry for sync_state.
  rpc SyncRegistry(SyncRegistryRequest) returns (SyncRegistryResponse);
  // Tests connectivity and credentials without saving.
  rpc TestRegistry(TestRegistryRequest) returns (TestRegistryResponse);
}

// ImageService browses indexed flatpak images.
service ImageService {
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc GetImage(GetImageRequest) returns (GetImageResponse);
  // Lists the distinct OCI repositories containing flatpak images, e.g. for
  // picking packages when editing repository rules.
  rpc ListImageRepositories(ListImageRepositoriesRequest) returns (ListImageRepositoriesResponse);
  // Lists packages: images grouped by flatpak ID and kind across
  // architectures, branches, tags and registries.
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  // Returns one package and all its variants (images).
  rpc GetPackage(GetPackageRequest) returns (GetPackageResponse);
}

// RepositoryService manages published flatpak repositories (indexes).
service RepositoryService {
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);
  rpc UpdateRepository(UpdateRepositoryRequest) returns (UpdateRepositoryResponse);
  rpc DeleteRepository(DeleteRepositoryRequest) returns (DeleteRepositoryResponse);
  // Returns exactly the images the index would serve for the given filters.
  rpc PreviewRepository(PreviewRepositoryRequest) returns (PreviewRepositoryResponse);
}

// ---------------------------------------------------------------------------
// System

message GetInfoRequest {}

message GetInfoResponse {
  string version = 1;
  // Base URL used for generated remote URLs, e.g. "https://flatpak.example.com".
  string public_url = 2;
  bool auth_enabled = 3;
  // Whether this server runs the sync scheduler itself. When false, syncs are
  // run by a separate "notary sync" process (e.g. a Kubernetes CronJob) and
  // SyncRegistry only records a request for it.
  bool embedded_sync = 4;
}

message GetMeRequest {}

message User {
  string subject = 1;
  string email = 2;
  string name = 3;
}

message GetMeResponse {
  bool authenticated = 1;
  bool auth_enabled = 2;
  // Unset when not authenticated or when auth is disabled.
  User user = 3;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  int32 registries = 1;
  int32 repositories = 2;
  int32 images = 3;
  int32 apps = 4;
  int32 runtimes = 5;
}

message LogoutRequest {}

message LogoutResponse {}

// ---------------------------------------------------------------------------
// Registries

enum AuthType {
  AUTH_TYPE_UNSPECIFIED = 0;
  AUTH_TYPE_ANONYMOUS = 1;
  // Username + password or token.
  AUTH_TYPE_BASIC = 2;
}

enum SyncState {
  SYNC_STATE_UNSPECIFIED = 0;
  SYNC_STATE_NEVER = 1;
  SYNC_STATE_SYNCING = 2;
  SYNC_STATE_OK = 3;
  SYNC_STATE_ERROR = 4;
}

message Registry {
  string id = 1;
  string name = 2;
  // Base URL of the OCI registry, e.g. "https://ghcr.io".
  string url = 3;
  // Allow plain http and skip TLS verification.
  bool insecure = 4;
  AuthType auth_type = 5;
  string username = 6;
  // The password/token is write-only; this tells whether one is stored.
  bool has_password = 7;
  // Discover repositories via /v2/_catalog (not supported by ghcr.io, Docker Hub, ...).
  bool use_catalog = 8;
  // Explicit repository names to index, e.g. "myorg/org.example.App".
  repeated string repositories = 9;
  // Globs limiting catalog results ("*" matches any characters incl. "/", "?" one character). Empty = all.
  repeated string repository_patterns = 10;
  // Globs for tags to index. Empty = all tags.
  repeated string tag_patterns = 11;
  // 0 disables periodic sync (manual only).
  int32 sync_interval_minutes = 12;
  SyncState sync_state = 13;
  google.protobuf.Timestamp last_sync_at = 14;
  string last_sync_error = 15;
  int64 last_sync_duration_ms = 16;
  // Number of indexed flatpak images from this registry.
  int32 image_count = 17;
  // Number of distinct OCI repositories containing flatpak images.
  int32 repository_count = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  // A sync was requested (SyncRegistry, or the registry was created/changed)
  // and waits for a syncer to pick it up.
  bool sync_requested = 21;
  // Progress of the running sync (sync_state SYNCING). total is 0 while the
  // repositories are still being discovered. Indexed repositories become
  // visible while the sync runs.
  int32 sync_repositories_done = 22;
  int32 sync_repositories_total = 23;
}

message RegistryInput {
  string name = 1;
  string url = 2;
  bool insecure = 3;
  AuthType auth_type = 4;
  string username = 5;
  // Unset keeps the stored password. Ignored for anonymous auth.
  optional string password = 6;
  bool use_catalog = 7;
  repeated string repositories = 8;
  repeated string repository_patterns = 9;
  repeated string tag_patterns = 10;
  int32 sync_interval_minutes = 11;
}

message ListRegistriesRequest {}

message ListRegistriesResponse {
  repeated Registry registries = 1;
}

message GetRegistryRequest {
  string id = 1;
}

message GetRegistryResponse {
  Registry registry = 1;
}

message CreateRegistryRequest {
  RegistryInput registry = 1;
}

message CreateRegistryResponse {
  Registry registry = 1;
}

message UpdateRegistryRequest {
  string id = 1;
  RegistryInput registry = 2;
}

message UpdateRegistryResponse {
  Registry registry = 1;
}

message DeleteRegistryRequest {
  string id = 1;
}

message DeleteRegistryResponse {}

message SyncRegistryRequest {
  string id = 1;
}

message SyncRegistryResponse {
  Registry registry = 1;
}

message TestRegistryRequest {
  RegistryInput registry = 1;
  // Set to reuse the stored password of an existing registry.
  optional string id = 2;
}

message TestRegistryResponse {
  bool ok = 1;
  string error = 2;
  // Whether /v2/_catalog worked.
  bool catalog_supported = 3;
  // Up to 50 repository names from the catalog, if supported.
  repeated string sample_repositories = 4;
}

// ---------------------------------------------------------------------------
// Images

enum RefKind {
  REF_KIND_UNSPECIFIED = 0;
  REF_KIND_APP = 1;
  REF_KIND_RUNTIME = 2;
}

message Image {
  string id = 1;
  string registry_id = 2;
  string registry_name = 3;
  // OCI repository path on the registry, e.g. "myorg/org.example.App".
  string repository = 4;
  // Manifest digest ("sha256:...").
  string digest = 5;
  string media_type = 6;
  string os = 7;
  // OCI architecture, e.g. "amd64", "arm64".
  string architecture = 8;
  repeated string tags = 9;
  // Full flatpak ref, e.g. "app/org.example.App/x86_64/stable".
  string ref = 10;
  RefKind kind = 11;
  string flatpak_id = 12;
  // Flatpak arch from the ref, e.g. "x86_64".
  string arch = 13;
  string branch = 14;
  // From appstream metadata; may be empty.
  string name = 15;
  string summary = 16;
  string version = 17;
  int64 installed_size = 18;
  int64 download_size = 19;
  // Image creation time from the config, if known.
  google.protobuf.Timestamp created = 20;
  // Icon served at GET /icons/{id} when true.
  bool has_icon = 21;
  google.protobuf.Timestamp indexed_at = 22;
  // From the flatpak metadata: the runtime this app (or extension/runtime)
  // builds on, e.g. "org.fedoraproject.Platform/x86_64/f44"; empty if none.
  string runtime = 23;
  // For extensions: the ref they extend ([ExtensionOf] ref); empty otherwise.
  string extension_of = 24;
  // Installing downloads extra data from external URLs ([Extra Data]).
  bool has_extra_data = 25;
}

// Pagination: page_size 0 means the default (50); values above 500 are
// clamped to 500. offset is the number of items to skip. Responses carry the
// total number of matching items so clients can render page numbers.

message ListImagesRequest {
  // Empty = all registries.
  string registry_id = 1;
  // Free-text search (case-insensitive) in ref, name, summary and repository.
  string query = 2;
  // Unspecified = all kinds.
  RefKind kind = 3;
  // Exact flatpak ID, e.g. "org.example.App" (all arches and branches).
  string flatpak_id = 4;
  // Exact OCI architecture, e.g. "amd64". Empty = all.
  string architecture = 5;
  int32 page_size = 6;
  int32 offset = 7;
}

message ListImagesResponse {
  // Ordered by ref, then repository.
  repeated Image images = 1;
  // Total number of images matching the filters (ignoring pagination).
  int32 total_size = 2;
}

message ListImageRepositoriesRequest {
  // Empty = all registries.
  string registry_id = 1;
  // Free-text search (case-insensitive) in repository, flatpak ID and name.
  string query = 2;
  int32 page_size = 3;
  int32 offset = 4;
}

// An OCI repository containing flatpak images.
message ImageRepository {
  string registry_id = 1;
  string registry_name = 2;
  // OCI repository path, e.g. "myorg/org.example.App".
  string repository = 3;
  // Distinct flatpak IDs of its images, sorted.
  repeated string flatpak_ids = 4;
  // Appstream name of one of its images; may be empty.
  string name = 5;
  RefKind kind = 6;
  int32 image_count = 7;
  // Distinct OCI architectures, sorted.
  repeated string architectures = 8;
  // An image of this repository that has an icon (GET /icons/{id}); empty = none.
  string icon_image_id = 9;
}

message ListImageRepositoriesResponse {
  // Ordered by repository.
  repeated ImageRepository repositories = 1;
  int32 total_size = 2;
}

message RegistryRef {
  string id = 1;
  string name = 2;
}

// A flatpak (app or runtime) identified by kind + flatpak ID. Its images may
// come from several registries and cover several architectures and branches.
message Package {
  RefKind kind = 1;
  string flatpak_id = 2;
  // Appstream name and summary of the newest variant; may be empty.
  string name = 3;
  string summary = 4;
  // Version of the newest variant; may be empty.
  string version = 5;
  // Distinct OCI architectures, sorted.
  repeated string architectures = 6;
  // Distinct branches, sorted.
  repeated string branches = 7;
  // Registries providing the package, sorted by name.
  repeated RegistryRef registries = 8;
  int32 image_count = 9;
  // A variant with an icon (GET /icons/{id}); empty = none.
  string icon_image_id = 10;
  // At least one variant downloads extra data on install.
  bool has_extra_data = 11;
  // Newest creation time among the variants.
  google.protobuf.Timestamp updated = 12;
}

message ListPackagesRequest {
  // Only packages with images in this registry; empty = all.
  string registry_id = 1;
  // Free-text search (case-insensitive) in flatpak ID, name and summary.
  string query = 2;
  // Unspecified = all kinds.
  RefKind kind = 3;
  // Only packages available for this OCI architecture; empty = all.
  string architecture = 4;
  int32 page_size = 5;
  int32 offset = 6;
}

message ListPackagesResponse {
  // Ordered by display name (name, falling back to flatpak ID), case-insensitive, then flatpak ID and kind.
  repeated Package packages = 1;
  int32 total_size = 2;
}

message GetPackageRequest {
  RefKind kind = 1;
  string flatpak_id = 2;
}

message GetPackageResponse {
  Package package = 1;
  // All images of the package, ordered by branch, architecture, registry name, repository.
  repeated Image variants = 2;
}

message GetImageRequest {
  string id = 1;
}

message GetImageResponse {
  Image image = 1;
  // All labels from the image config (icon data URIs stripped).
  map<string, string> labels = 2;
  // Flatpak metadata keyfile from the org.flatpak.metadata label.
  string metadata = 3;
}

// ---------------------------------------------------------------------------
// Repositories

// A rule selecting images of the repository's registry. An image is served if
// it matches at least one include rule and no exclude rule. Empty patterns
// match everything.
message Source {
  // Glob on the OCI repository path ("*" matches any characters incl. "/").
  string repository_pattern = 1;
  // Glob on the flatpak ref, e.g. "app/org.gnome.*".
  string ref_pattern = 2;
  // Glob on tags; matches if any of the image's tags matches.
  string tag_pattern = 3;
  bool exclude = 4;
}

message RepositoryUrls {
  // For `flatpak remote-add`, e.g. "oci+https://host/repo/stable".
  string remote = 1;
  // Downloadable .flatpakrepo file.
  string flatpakrepo = 2;
  // The index endpoint flatpak queries (without query parameters).
  string index = 3;
}

message Repository {
  string id = 1;
  // URL-safe identifier: [a-z0-9][a-z0-9._-]*
  string slug = 2;
  string title = 3;
  string description = 4;
  string homepage = 5;
  // A repository serves images of exactly one upstream registry, because the
  // flatpak index format has a single "Registry" base URL.
  string registry_id = 6;
  string registry_name = 7;
  repeated Source sources = 8;
  // Images matched by the sources (all arches and tags, before per-ref de-duplication).
  int32 image_count = 9;
  RepositoryUrls urls = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message RepositoryInput {
  string slug = 1;
  string title = 2;
  string description = 3;
  string homepage = 4;
  string registry_id = 5;
  repeated Source sources = 6;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message GetRepositoryRequest {
  string id = 1;
}

message GetRepositoryResponse {
  Repository repository = 1;
}

message CreateRepositoryRequest {
  RepositoryInput repository = 1;
}

message CreateRepositoryResponse {
  Repository repository = 1;
}

message UpdateRepositoryRequest {
  string id = 1;
  RepositoryInput repository = 2;
}

message UpdateRepositoryResponse {
  Repository repository = 1;
}

message DeleteRepositoryRequest {
  string id = 1;
}

message DeleteRepositoryResponse {}

message PreviewRepositoryRequest {
  string id = 1;
  // OCI architecture; empty = all.
  string architecture = 2;
  // Like flatpak's "#tag" remote suffix; empty = all tags. Flatpak's default is "latest".
  string tag = 3;
  int32 page_size = 4;
  int32 offset = 5;
}

// A runtime needed by served images but not served by the repository itself;
// clients need another remote providing it or the install fails.
message MissingRuntime {
  // Runtime ref without kind, e.g. "org.fedoraproject.Platform/x86_64/f44".
  string runtime = 1;
  // Flatpak IDs of the served images that need it, sorted.
  repeated string needed_by = 2;
  // Registries (other than the repository's) that have it indexed, if any.
  repeated RegistryRef available_in = 3;
}

message PreviewRepositoryResponse {
  // Ordered by ref, then repository.
  repeated Image images = 1;
  // Total number of images the index would serve for these filters.
  int32 total_size = 2;
  // Computed over the whole selection (not just this page).
  repeated MissingRuntime missing_runtimes = 3;
}
