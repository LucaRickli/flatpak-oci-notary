name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated:
    name: Proto lint & generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: deno install --frozen
        working-directory: frontend
      - run: buf lint
      - run: buf generate
      - name: Generated code is up to date
        run: git diff --exit-code -- internal/gen frontend/src/lib/api/gen

  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    services:
      # The store tests run against SQLite always and against Postgres when
      # NOTARY_TEST_POSTGRES_DSN is set.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notary
          POSTGRES_PASSWORD: notary
          POSTGRES_DB: notary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U notary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTARY_TEST_POSTGRES_DSN: postgres://notary:notary@localhost:5432/notary?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal frontend/*.go | tee /dev/stderr)"
      - run: go vet -tags noui ./...
      - run: go test -race -tags noui ./...
      - name: CGO-free build
        run: CGO_ENABLED=0 go build -tags noui ./cmd/notary

  frontend:
    name: Frontend check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - name: Unit tests (flatpak metadata parsing, permission ratings, URL sanitizing)
        run: deno task test
      - run: deno task check
      - run: deno task build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
